<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Asteroids MVP</title>
<link rel="stylesheet" href="style.css?v=002">
</head>
<body>
<!-- Client/UI layer -->
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <span id="hudLevel">Level: 1</span>
  <span id="hudScore">Score: 0</span>
  <span id="hudHighScore">High Score: 0</span>
</div>

<div id="powerupBanner"></div>

<div id="levelBanner"></div>

<div id="gameOverScreen">
  <h1>Game Over</h1>
  <p id="finalScore">Final Score: 0</p>
  <p>Press R or click below to restart</p>
  <button id="restartBtn">Restart</button>
</div>

<script src="app.js?v=002"></script>
</body>
</html>
